name: 故障报告
description: 报告可复现的桌面或研究流程问题；安全漏洞请按 SECURITY.md 私密报告。
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: 请使用合成数据复现。不要上传 API key、runtime_config.json、原始日志或个人研究记录。安全问题请先查看 SECURITY.md。
  - type: input
    id: version
    attributes:
      label: 应用版本或源码提交
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: 系统版本与架构
      description: 例如 Windows x64，或 macOS Apple Silicon；注明具体系统版本。
    validations:
      required: true
  - type: dropdown
    id: installation
    attributes:
      label: 运行方式
      options:
        - 下载的桌面预览包
        - 从源码运行
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: 复现步骤、预期结果与实际结果
      description: 是否也能在离线示例中复现？截图请先移除个人信息。
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: 已脱敏的错误摘要
      description: 只贴必要错误行，不上传完整配置、凭证或用户数据目录。
