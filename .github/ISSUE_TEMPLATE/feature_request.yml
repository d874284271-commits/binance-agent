name: 功能建议
description: 说明研究场景、当前困难和希望得到的可观察结果。
title: "[Feature] "
body:
  - type: textarea
    id: scenario
    attributes:
      label: 场景与当前困难
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: 希望得到的结果
      description: 请描述用户操作与结果，避免提交凭证或个人研究资料。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 目前的替代做法
