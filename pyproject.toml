[project]
name = "binance-agent"
version = "0.3.0a1"
description = "本地多智能体金融策略分析桌面助手(仅分析,不下单)"
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = { text = "MIT" }

# 核心依赖:跑通 M0-M4(数据层/资讯层/编排/无UI)所需
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "sse-starlette>=2.1",
    "httpx[socks]>=0.27",
    "orjson>=3.10",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "numpy>=2.1",
    "python-binance>=1.0.36",
    # 编排 + LLM (pin 大版本应对 1.x/0.x 接口变动)
    "langgraph>=1.1,<2",
    "langgraph-checkpoint>=2.0",
    "langchain-core>=0.3",
    "langchain-openai>=0.2",
    # 资讯层轻量源
    "feedparser==6.0.14",
    "feedparser-sgmllib==2.1.0",
    # 安全:币安 Key 加密落盘
    "cryptography>=43",
    "keyring>=25",
    # 配置 / 环境变量加载
    "python-dotenv>=1.0",
    "tomli>=2.0; python_version < '3.11'",  # 3.10 无内置 tomllib
    "trafilatura==2.2.0",
]

[project.optional-dependencies]
# M5/M6 桌面壳 + 全局热键(pythonnet 在新 Python 上 wheel 易缺,单列)
desktop = [
    "pywebview>=5.3",
    "pynput>=1.7",
    "pyperclip>=1.9",
    "pyobjc-core==12.2.2; sys_platform == 'darwin'",
]
# M2 中文快讯/宏观事件(akshare 拉 pandas,体量大,单列按需装)
intel-cn = [
    "akshare>=1.14",
]
# 桌面分发打包(配合 packaging/binance-agent.spec)
build = [
    "pyinstaller>=6.11",
]
# 测试 + 工程化工具链(ruff/mypy/pre-commit)
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
    "anyio>=4",
    "ruff>=0.8",
    "mypy>=1.13",
    "pre-commit>=4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/binance_agent"]

# ───────────────────────── 测试 ─────────────────────────
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q"

# ───────────────────────── ruff:lint + format ─────────────────────────
[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
# E/W 风格, F 逻辑, I import 排序, UP 现代语法, B bugbear,
# C4 推导式, SIM 简化, ASYNC 异步陷阱, RUF ruff 专属
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "ASYNC", "RUF"]
ignore = ["E501"]  # 行宽交给 formatter

[tool.ruff.lint.isort]
known-first-party = ["binance_agent"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]  # 测试允许 assert

[tool.ruff.format]
quote-style = "double"

# ───────────────────────── mypy:渐进式类型检查 ─────────────────────────
[tool.mypy]
python_version = "3.10"
plugins = ["pydantic.mypy"]
mypy_path = "src"
packages = ["binance_agent"]
warn_unused_ignores = true
warn_redundant_casts = true
warn_return_any = true
no_implicit_optional = true
# 渐进式:暂不强制全量注解,聚焦真实类型错误
disallow_untyped_defs = false
check_untyped_defs = true
# 第三方库(akshare/feedparser/pywebview/pynput/finnhub)无 stub
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.uv]
# M0 默认只装核心 + dev,桌面/中文源按里程碑追加
default-groups = []
# Align optional macOS frameworks with the audited PyObjC source/license release.
constraint-dependencies = [
    "pyobjc-framework-applicationservices==12.2.2",
    "pyobjc-framework-cocoa==12.2.2",
    "pyobjc-framework-coretext==12.2.2",
    "pyobjc-framework-quartz==12.2.2",
    "pyobjc-framework-security==12.2.2",
    "pyobjc-framework-uniformtypeidentifiers==12.2.2",
    "pyobjc-framework-webkit==12.2.2",
]

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true
